[project]
name = "ontology-pjt"
version = "0.1.0"
description = "Ontology-Grounded RAG Governance Platform MVP"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
  "unit: pure unit tests with no external dependencies",
  "invariant: regression tests that protect MVP invariants",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
  "E501",  # let the formatter own line length
  "B008",  # FastAPI Depends in defaults
  "SIM117",  # nested with-blocks
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # asserts in tests are OK
"alembic/**" = ["F401"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
ignore_missing_imports = true
no_implicit_optional = true
exclude = ["alembic/", "tests/"]
